[project]
name = "studio-atlas"
version = "0.11.0"
description = "Atlas - map-driven TUI/CLI for studio shared-drive project tooling (spec: LIBRARY - Reference/_House Standard/atlas-tui-spec.md)"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=3",
    "pypdf[crypto]>=6.18,<7",
    "textual>=8.2,<9",
]

[project.scripts]
atlas = "atlas.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
